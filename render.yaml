services:
  - type: web
    name: smart-classroom-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /tmp/smart-classroom-data
      - key: MODELS_DIR
        value: /tmp/smart-classroom-models